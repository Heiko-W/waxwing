packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# esbuild's postinstall fetches its platform binary, and pnpm refuses to run install scripts that
# are not named here — under `--frozen-lockfile` it fails the whole install with
# `ERR_PNPM_IGNORED_BUILDS`. So an existing checkout works (it approved the script interactively,
# once, and pnpm remembered in node_modules) while a FRESH CLONE cannot install at all. That is
# the shape of the defect the first CI run on this repository hit, and it is the shape every new
# contributor would have hit.
#
# BOTH keys, deliberately: `engines.pnpm` allows >= 10, and pnpm 11 renamed the setting.
# `allowBuilds` is what 11 reads — an object, not a list — and `onlyBuiltDependencies` is what 10
# reads. pnpm 11 silently ignores the old key, which is why the old one alone looked correct in
# the file and failed on a clean machine.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

# Transitive security fixes (Dependabot alerts, 2026-08-18). Every one of these is a BUILD- or
# TEST-time dependency — none reaches the browser bundle — but each target version sits INSIDE the
# range its parent already declares, so these force a patch pnpm would otherwise leave alone rather
# than overriding a contract:
#
#   undici           jsdom@29.1.1     wants ^7.25.0   -> 7.29.0
#   fast-uri         ajv@8.20.0       wants ^3.0.1    -> 3.1.5
#   nanoid           postcss@8.5.16   wants ^3.3.12   -> 3.3.18
#   postcss          vite@8.1.3       wants ^8.5.16   -> 8.5.23
#   brace-expansion  minimatch@5.1.9  wants ^2.0.1    -> 2.1.4
#   brace-expansion  minimatch@10.2.5 wants ^5.0.5    -> 5.0.9
#
# HERE and not `pnpm.overrides` in package.json: pnpm 11 reads its settings from this file, and
# silently ignores the package.json block — the same trap `allowBuilds` above documents. Verified by
# checking that `overrides:` appears in pnpm-lock.yaml afterwards; it does not when the block sits in
# package.json.
#
# esbuild (GHSA-g7r4-m6w7-qqqr) is deliberately ABSENT. The fix is 0.28.1, tsup@8.5.1 — the latest —
# declares ^0.27.0, so an override would break a semver contract in the build toolchain. The
# advisory is a path traversal in esbuild's OWN dev server, on WINDOWS only; this repo uses vite's
# dev server, and CI is ubuntu-latest. Revisit when tsup moves.
overrides:
  undici: ^7.29.0
  fast-uri: ^3.1.5
  nanoid: ^3.3.18
  postcss: ^8.5.23
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
