packages:
  - "apps/*"
  - "packages/*"
  - "e2e"

# esbuild's postinstall fetches its platform binary, and pnpm refuses to run install scripts that
# are not named here — under `--frozen-lockfile` it fails the whole install with
# `ERR_PNPM_IGNORED_BUILDS`. So an existing checkout works (it approved the script interactively,
# once, and pnpm remembered in node_modules) while a FRESH CLONE cannot install at all. That is
# the shape of the defect the first CI run on this repository hit, and it is the shape every new
# contributor would have hit.
#
# BOTH keys, deliberately: `engines.pnpm` allows >= 10, and pnpm 11 renamed the setting.
# `allowBuilds` is what 11 reads — an object, not a list — and `onlyBuiltDependencies` is what 10
# reads. pnpm 11 silently ignores the old key, which is why the old one alone looked correct in
# the file and failed on a clean machine.
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild

# The Node version this repository's tests are known good on — `.nvmrc` and `engines.node` say 24,
# and this is what makes `pnpm install` STOP on anything else instead of printing one `[WARN]` line
# into the install noise and letting a newcomer discover the problem two minutes later, in the
# middle of `pnpm verify`, from fifty red tests that never mention Node.
#
# HERE and not `.npmrc`, for the third time in this file: pnpm 11 reads its own settings from
# pnpm-workspace.yaml and ignores `engine-strict=true` in `.npmrc` entirely — measured with
# pnpm 11.1.1 against a manifest that could not possibly be satisfied. `.npmrc` gave a warning and
# exit 0; this key gives ERR_PNPM_UNSUPPORTED_ENGINE and exit 1. `.npmrc` held nothing else and is
# gone. `scripts/ci.mjs --check-node` stays as the second line of defence, because a checkout that
# was installed on Node 24 and is later RUN on another major never passes through an install.
engineStrict: true

# Transitive security fixes (Dependabot alerts, 2026-08-18). Every one of these is a BUILD- or
# TEST-time dependency — none reaches the browser bundle — but each target version sits INSIDE the
# range its parent already declares, so these force a patch pnpm would otherwise leave alone rather
# than overriding a contract:
#
#   undici           jsdom@29.1.1     wants ^7.25.0   -> 7.29.0
#   fast-uri         ajv@8.20.0       wants ^3.0.1    -> 3.1.6
#   nanoid           postcss@8.5.16   wants ^3.3.12   -> 3.3.18
#   postcss          vite@8.1.3       wants ^8.5.16   -> 8.5.23
#   brace-expansion  minimatch@5.1.9  wants ^2.0.1    -> 2.1.4
#   brace-expansion  minimatch@10.2.5 wants ^5.0.5    -> 5.0.9
#   browserslist     @babel/helper-compilation-targets@7.29.7 wants ^4.24.0 -> 4.28.7
#
# (2026-09-06: fast-uri raised 3.1.5 -> 3.1.6 and browserslist added, both for new advisories; the
# esbuild note below is no longer an exception.)
#
# HERE and not `pnpm.overrides` in package.json: pnpm 11 reads its settings from this file, and
# silently ignores the package.json block — the same trap `allowBuilds` above documents. Verified by
# checking that `overrides:` appears in pnpm-lock.yaml afterwards; it does not when the block sits in
# package.json.
#
# esbuild (GHSA-g7r4-m6w7-qqqr) IS here now, and it is the one entry that leaves a declared range
# rather than forcing a patch inside one — so it needs more than a line.
#
# tsup@8.5.1 is still the latest and still declares `esbuild ^0.27.0`, so nothing moved upstream.
# What changed is the measurement. vite@8.1.3 — the other consumer, and the one that builds the
# shipped bundle — declares esbuild as an OPTIONAL PEER at `^0.27.0 || ^0.28.0` and uses ^0.28.1 in
# its own devDependencies, so 0.28 is the version vite is developed against. That leaves tsup as the
# sole objector, and tsup's use of esbuild here is `build:libs` for the three workspace packages.
#
# Verified rather than assumed, because a 0.x minor is a breaking change by convention:
# `pnpm build:libs` succeeds on 0.28.2 and emits byte-identical sizes (jmap ESM 89.10 KB, DTS
# 216.45 KB, map 337.49 KB — the same three numbers as on 0.27.7), and the full `pnpm gate` passes
# including the dist contract and the 300 KB budget. If tsup ever does break on it, `build:libs` is
# where it surfaces, loudly, before anything ships.
#
# Drop this entry the moment tsup declares ^0.28 — it exists to close an alert, not to stay.
overrides:
  undici: ^7.29.0
  fast-uri: ^3.1.6
  browserslist: ^4.28.7
  nanoid: ^3.3.18
  postcss: ^8.5.23
  brace-expansion@2: ^2.1.4
  brace-expansion@5: ^5.0.9
  esbuild: ^0.28.1
