<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Waxwing app icon">
  <title>Waxwing app icon</title>
  <!--
    The IN-APP mark (config.json `branding.logo`), and deliberately flatter than the PWA icons
    beside it.

    It used to be a two-stop orange gradient, which broke both halves of one sentence in the design
    system's first principle: "no gradients-as-decoration, no more than one saturated color on
    screen at rest". At rest this app shows a blue accent; the mark was a saturated orange next to
    it, on every screen, and in the dark theme it was the strongest colour present.

    One flat fill now, and the wax drop keeps its own colour because it IS the logo's idea (a waxwing
    is named for the red tips on its wing) rather than decoration. The launcher icons —
    icon-192/512, maskable, apple-touch — keep their gradient: a home-screen icon is a badge on
    someone else's canvas, not a persistent element of this UI, and there the convention is the
    opposite one.
  -->
  <defs>
    <mask id="waxwing-im">
      <rect width="256" height="256" fill="black"/>
      <g transform="translate(34,34) scale(0.73)">
        <polygon points="72,170 20,208 32,228 86,196" fill="white"/>
        <circle cx="120" cy="150" r="62" fill="white"/>
        <circle cx="170" cy="104" r="40" fill="white"/>
        <polygon points="148,80 103,36 184,70" fill="white"/>
        <polygon points="204,92 238,106 204,120" fill="white"/>
        <line x1="108" y1="208" x2="103" y2="232" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <line x1="134" y1="206" x2="131" y2="232" stroke="white" stroke-width="10" stroke-linecap="round"/>
        <circle cx="180" cy="98" r="6.5" fill="black"/>
      </g>
    </mask>
  </defs>
  <rect width="256" height="256" rx="58" fill="#E07C12"/>
  <rect width="256" height="256" fill="#ffffff" mask="url(#waxwing-im)"/>
  <!-- the sealing-wax drop on the wing -->
  <circle cx="104.8" cy="153.7" r="7.3" fill="#C4331D"/>
</svg>
