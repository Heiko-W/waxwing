  <title>Waxwing</title>
  <!--
    The horizontal lockup: mark plus wordmark.

    The wordmark is Inter Display SemiBold at 56 units with -12/1000 em tracking, SHAPED
    (HarfBuzz, kerning on) and OUTLINED TO PATHS. It deliberately carries no <text>: the
    previous lockup set the name in the system font stack, so it rendered differently on
    every machine and could not be relied on as a brand asset.

    Alignment: the mark is scaled 0.375 (256 -> 96) and shifted left so its silhouette
    starts flush at x = 0; the wordmark baseline sits at y = 68.4 so that the midpoint of
    the x-height meets the vertical centre of the bird. Both edges of the viewBox are flush
    with the artwork — a consumer adds its own clear space.
  -->
