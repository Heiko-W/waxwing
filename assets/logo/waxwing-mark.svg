<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Waxwing logo mark">
  <title>Waxwing</title>
  <!--
    The one-colour mark: a perched waxwing as a SINGLE closed contour.

    The outline is constructed, not drawn freehand. Three leading circles (breast, rump,
    head) fix the masses; the back and belly are large blending arcs laid tangentially
    across both body circles, throat and nape are fillet arcs, and the tail leaves the rump
    on a tangent. Between the anchors a biarc solve fits two true circular arcs with
    matching end tangents, so G1 continuity is a property of the construction rather than
    something smoothed in afterwards. Every arc is emitted as a cubic (4/3·tan(delta/4)·r).
    Only four corners are deliberate: the bill tip, the crest tip and the two tail corners.

    The eye is an evenodd cut-out, so the mark is one path and inherits any fill.
  -->
