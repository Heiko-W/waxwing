# What this file exists for, and what it deliberately does NOT do.
#
# Every `uses:` in .github/workflows/ is pinned to a 40-hex commit SHA rather than `@v4`, because a
# tag is a mutable pointer and moving one runs foreign code inside a job that, in release.yml,
# holds `contents: write` over the published artefacts. The pin closes that. It also FREEZES the
# action: a security fix upstream never arrives, and the trailing `# v4.4.0` comment slowly becomes
# a lie about what the SHA actually is. A pin with nothing maintaining it trades a live risk for a
# quiet one.
#
# So this is the other half of the pin, not an optional extra. Dependabot understands the
# `sha # comment` form and rewrites BOTH the SHA and the version comment in one PR, which is the
# only reason SHA pinning is workable by hand at all.
#
# BUT ONLY FOR THE EXACT FORM `# vX.Y.Z`. This was written as an unconditional promise and it is
# not one. `pnpm/action-setup` carried `# v4 @ 2026-03-11 — see header`, and the bump to v6.0.10
# (PR #11) moved the SHA two majors while leaving that comment reading `v4`. The bot does not
# recognise a decorated comment, does not touch it, and does not warn. Anything other than a bare
# `# vX.Y.Z` opts that line out of the maintenance this file exists to provide — so it is a
# defect, not a style choice, and `checkWorkflowActionPins` in scripts/ci.mjs now rejects it.
#
# ── SCOPE: github-actions ONLY ────────────────────────────────────────────────────────────────
#
# The npm ecosystem is deliberately absent. `pnpm-lock.yaml` is the reproducibility contract for
# the shipped bundle, `pnpm install --frozen-lockfile` is what CI runs, and a bot opening a dozen
# lockfile PRs a week against a one-maintainer project produces exactly one behaviour: they get
# merged unread. Waxwing's dependency posture is stated in SECURITY.md §5 — a small list, reviewed
# by a person — and automated bumping of it is a separate decision, not a side effect of wanting
# maintained action pins. Workflow actions are different in kind: there are nine of them, they
# change rarely, and each one is code that runs with a token.
#
# Verify a pin by hand at any time with:
#   gh api repos/<owner>/<action>/commits/<tag> --jq .sha
#
# NOT `git/ref/tags/<tag> --jq .object.sha`, which is what this said until it was checked against a
# real bump. Most action tags are ANNOTATED, so that endpoint answers with the tag OBJECT rather
# than the commit — for pnpm/action-setup v6.0.10 it returns ff378ebe…, while the commit Dependabot
# correctly pins is 0977fd99…. The recipe therefore reported a mismatch on a pin that was right,
# which is the worst way for a verification step to fail. `commits/<tag>` dereferences for you.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 10, not the default 5. There are nine pinned actions, and at 5 the bot silently stopped
    # proposing anything once five PRs sat open: `actions/checkout` (v4 → v7),
    # `actions/setup-node` (v4 → v7) and `pnpm/action-setup` (v4 → v6) were all behind that cap
    # and invisible. A limit lower than the number of things being watched turns "Dependabot
    # maintains the pins" into "Dependabot maintains whichever pins moved first" — which is the
    # quiet rot this file exists to prevent.
    #
    # NOT `groups`, deliberately: one grouped PR spanning eight majors fails as a unit, and then
    # nothing moves at all.
    open-pull-requests-limit: 10
    commit-message:
      # Conventional Commits, scope `ci` — the same convention CLAUDE.md requires of humans.
      prefix: 'chore(ci)'
    labels:
      - dependencies
