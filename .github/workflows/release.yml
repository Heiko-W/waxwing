# Waxwing release — live. It published v0.9.0 on 2026-08-17.
#
# Written before the repository existed (ADR-003) so that a release would be
# `git tag v1.0.0 && git push --tags` rather than a design exercise. It now is.
#
# ── THE ONE RULE THIS FILE FOLLOWS ────────────────────────────────────────────────────────────
#
# It is a THIN CALLER of `scripts/release.mjs`, which is the same script `pnpm release` runs
# locally. It does not reimplement packing, naming or checksums. That is the same rule
# `ci.yml` follows for `scripts/ci.mjs`, and for the same reason: a workflow that duplicates a
# script drifts from it, and the drift is only ever discovered when a tag has already been pushed
# and the artefact is already wrong.
#
# So: everything a release DOES is testable locally, today, with `pnpm release`. What this file
# adds is only what a local run cannot do — attaching the result to a GitHub release.
#
# ── WHY IT RE-RUNS THE FULL GATE ──────────────────────────────────────────────────────────────
#
# A tag can be pushed from any working tree, including one that never ran `pnpm gate`. The gate is
# ~10 minutes; a bad release is permanent (a deleted tag is worse than no tag, because someone has
# already fetched it). The order is deliberate: gate first, artefacts second, publish last.
#
# ── WHY THE `uses:` LINES ARE SHAs AND THE TOKEN IS SCOPED PER JOB ────────────────────────────
#
# This is the workflow that signs the project's name to a binary, so the two cheap mistakes are
# expensive here specifically.
#
# 1. **SHA pins.** `@v2` / `@v4` are MUTABLE tags. Moving one is how tj-actions/changed-files
#    (March 2025) turned thousands of repositories into a credential dump: the version string in
#    every workflow file stayed the same while the code behind it changed. In THIS file the
#    consequences are concrete — `pnpm/action-setup` runs BEFORE the build and can patch the tree
#    it is about to build, and `softprops/action-gh-release` runs AFTER `dist-release/` exists and
#    holds the token that uploads it, so it can swap the zip AND regenerate SHA256SUMS to match.
#    A 40-hex pin cannot be moved; .github/dependabot.yml is what keeps it current.
# 2. **Per-job `permissions:`.** `contents: write` used to sit at workflow level, so the `gate`
#    job — which runs `pnpm gate`: Docker, Playwright, the whole dependency tree, none of it ours
#    — held a token that can push to the repository and create releases, for forty-five minutes,
#    for no reason. Permissions now sit on the job that needs them and nowhere else.
# 3. **`persist-credentials: false` on every checkout.** The default is `true`, which leaves the
#    job's token on the RUNNER after the checkout step is over, readable by everything that comes
#    after it. In the `release` job that token is `contents: write`, and the steps after it include
#    `pnpm install` (which is allowed to run esbuild's postinstall) and `pnpm release`. Neither job
#    pushes with git, so neither needs the credential to persist at all. Same class of reasoning as
#    the pins above: shrink what a step COULD do, not only what it does.
#
#    WHERE the token is left changed under us, and the earlier wording did not survive it. Up to
#    checkout v5 the default wrote the credential into the repository's own `.git/config`; from
#    v6.0.0 it writes `$RUNNER_TEMP/git-credentials-<uuid>.config` and pulls that in through an
#    `includeIf` (see `credentialsConfigPath` in src/git-auth-helper.ts at the pinned SHA). That is
#    tidier — it stops the credential travelling with the checked-out tree — but it does not change
#    the fact this bullet is about: `RUNNER_TEMP` is readable by every later step in the same job.
#    So `false` stays right at all five call sites, and the sentence naming `.git/config` did not.
#
# ── WHAT THE ATTESTATION BUYS THAT SHA256SUMS DOES NOT ────────────────────────────────────────
#
# `SHA256SUMS` proves the file survived the network and the hoster intact. It proves NOTHING about
# where the file came from, because whoever can replace the zip can also replace SHA256SUMS — and
# an unpinned action, a stolen PAT or a compromised maintainer laptop is exactly that "whoever".
# `actions/attest-build-provenance` records a Sigstore-signed SLSA provenance statement binding the
# artefact digest to THIS repository, THIS workflow file and THIS commit, keyless (the runner's
# OIDC identity, no key for a solo maintainer to lose). A deployer checks it with
#   gh attestation verify waxwing-stalwart.zip --repo Heiko-W/waxwing
# and it fails for a zip built anywhere else. What it still does not cover: a compromise of the
# source this workflow builds. Provenance answers "who built it", never "is it good".

name: Release

on:
  push:
    tags: ['v*']
  # So the whole thing can be rehearsed against a branch without creating a tag. It builds and
  # uploads artefacts to the run, and does NOT create a release — see the `if:` on that step.
  workflow_dispatch:

jobs:
  gate:
    name: gate (full pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Runs untrusted code (every dependency, a browser, a Docker fixture) and produces nothing but
    # a pass/fail. It reads the tree; it must not be able to write one.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same entry point the local gate uses: verify + fixture + integration + Playwright.
      - run: pnpm gate

  release:
    name: build, check and publish the artefacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: gate
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # the runner's OIDC token — what makes the attestation keyless
      attestations: write # write the provenance statement to this repository's attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The tag names the release; `package.json` names the ARTEFACTS. If they disagree, the
      # download is called something other than what was tagged and every checksum reference in
      # the release notes is wrong. Cheaper to catch here than to explain afterwards.
      - name: The tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # Builds both artefacts + SHA256SUMS, then asserts the five things a deployer would
      # otherwise discover the hard way (zip extension, index.html at the root, the 100 MiB cap,
      # the <base href="/"> token, manifest.json rather than .webmanifest).
      - run: pnpm release

      # Immediately after the build and before anything else touches `dist-release/`, so the
      # digests in the provenance statement are the ones the packer just produced. Deliberately NOT
      # gated on `refs/tags/v`: an attestation step whose first execution is the release it exists
      # to protect is a step nobody has tested. A rehearsal's attestation is honest — it says a
      # branch build happened — and `gh attestation verify` shows which ref it came from.
      - name: Attest build provenance (SLSA, keyless — see the header)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The two zips are byte-identical (release.mjs copies rather than re-packs), so they
          # share one digest and one attestation; both names are listed so either downloaded
          # filename verifies.
          subject-path: |
            dist-release/*.zip
            dist-release/*.tar.gz

      # Always, so a workflow_dispatch rehearsal produces something to inspect.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: waxwing-release
          path: dist-release/
          retention-days: 14

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist-release/*
          generate_release_notes: true
          # A release is not a place to discover that the deployment guide was not updated.
          body: |
            ## Deploying

            Three supported paths — see [`docs/deployment.md`](docs/deployment.md). The short
            version: use **`waxwing-stalwart-${{ github.ref_name }}.zip`** for a Stalwart
            Application (recommended, same-origin, no CORS), and
            **`waxwing-web-${{ github.ref_name }}.tar.gz`** behind your own web server.

            Verify what you downloaded before deploying it. The two checks answer different
            questions and the second is the stronger one:

            ```sh
            # Did the file survive the network and the hoster intact?
            sha256sum -c SHA256SUMS

            # Was it built by this repository's release workflow, from this commit?
            # (SHA256SUMS cannot answer that: anyone who can replace the zip can regenerate it.)
            gh attestation verify waxwing-stalwart-${{ github.ref_name }}.zip --repo ${{ github.repository }}
            ```

            Configuration lives in `config.json` next to `index.html` and needs no rebuild —
            [`docs/configuration.md`](docs/configuration.md) is the reference.
