# Waxwing project site — live; first deployed 2026-08-17.
#
# Written before the repository existed (ADR-003), for the same reason `ci.yml` and `release.yml`
# were: the day a repository was created, the site was a push away.
#
# ── WHAT IT PUBLISHES, AND WHAT IT DELIBERATELY DOES NOT ──────────────────────────────────────
#
# It publishes `docs/site/` — one hand-written page, no generator, no theme dependency. The
# alternative (Jekyll, Docusaurus, VitePress) buys navigation and search for a site with four
# sections, in exchange for a build toolchain that has to be kept alive.
#
# It does NOT publish a live demo. A demo needs a mail server, and the only honest ones are
# either a real account (which nobody should hand to a demo) or a fake JMAP backend — which
# would be a second implementation of the server, maintained forever, that gradually stops
# resembling any real one. Decision log #1 also rules out paid domains, so this lives at
# github.io.
#
# The `uses:` lines are 40-hex commit pins, not `@v4` tags, for the reason spelled out at the top
# of release.yml: a tag is a mutable pointer and moving one is a supply-chain primitive. Here the
# stake is smaller (the token cannot write the repository, only publish a Pages artefact) but the
# `pages: write` + `id-token: write` pair below is still enough to replace the published site, and
# .github/dependabot.yml has to maintain these pins anyway.

name: Pages

on:
  push:
    branches: [main]
    paths: ['docs/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
