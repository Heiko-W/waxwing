# Waxwing CI — live on github.com/Heiko-W/waxwing since 2026-08-17.
#
# It was written before the repository existed (ADR-003) so that the day one was created, CI was a
# `git push` away rather than a design exercise — and so the local pipeline and the hosted one are
# provably the same list of stages: both call `scripts/ci.mjs`, which calls the same pnpm scripts.
# ADR-003 requires exactly that ("a thin wrapper that simply calls these same scripts, so the checks
# do not diverge between local and CI"). The local gate is unchanged and still the inner loop:
#   pnpm gate        the full pipeline (Docker + browser)
#   pnpm gate:fast     the hermetic half — also wired to .githooks/pre-push
#
# Cost note, because it is the usual reason to hesitate: GitHub-hosted runners are FREE with no
# minute cap on PUBLIC repositories, on every plan, and that survived the January 2026 repricing.
# Waxwing is AGPL-3.0 and public, so this workflow costs nothing. A private repo would draw on the
# plan's monthly free minutes instead (~5 min per full run here).
#
# ── WHY EVERY `uses:` IS A 40-CHARACTER SHA ───────────────────────────────────────────────────
#
# A tag is a mutable pointer. `actions/checkout@v4` is whatever the `v4` tag points at when the run
# starts, and a compromised upstream that moves it runs foreign code in this job (the tj-actions/
# changed-files incident, March 2025, is the reference case). A SHA cannot be moved. The trailing
# `# vX.Y.Z` is the human-readable version and is maintained by .github/dependabot.yml, which opens
# a PR when the upstream release moves — so the pin does not silently rot into an unpatched build.
# This job holds only a read token (see `permissions` below), so the blast radius here is the
# runner, not the repository; release.yml is where the same pins actually matter.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Defence in depth, not a fix: this repository's org-level default is already
# `default_workflow_permissions: read`, so CI never held a write token. Stated here anyway, because
# that setting lives in a web UI nobody reviews and one click restores the old `write` default for
# every workflow at once. CI reads the tree, runs tests and uploads an artefact; it writes nothing.
permissions:
  contents: read

jobs:
  # The hermetic half: typecheck, Biome, ~2900 Vitest tests, the production build and the
  # size-limit budget. No Docker, no browser — so it fails in ~2 minutes on anything broken,
  # before the expensive job is worth starting.
  verify:
    name: verify (typecheck, lint, tests, size)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 @ 2026-03-11 — see header
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # From .nvmrc, never a floating major. On node >= 25 a global `localStorage` shadows
          # jsdom's and fails 22 tests for reasons unrelated to the code — the same trap
          # scripts/ci.mjs refuses to run into locally.
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # The Docker + browser half: the Stalwart fixture, the jmap integration suites (which fail OPEN
  # when the fixture is down — defect B22 — so `pnpm gate` asserts they were not skipped), and the six
  # Playwright suites. Ubuntu runners ship a working Docker daemon, so the fixture's compose file
  # and its fixed host port work unchanged.
  e2e:
    name: e2e (Stalwart fixture + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 @ 2026-03-11 — see header
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # verify-e2e.mjs installs the pinned Chromium itself and always tears the fixture down.
      - run: pnpm verify:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
